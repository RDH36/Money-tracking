plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mitsitsyocr'
version = '0.1.0'

android {
  namespace "expo.modules.mitsitsyocr"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // ML Kit Text Recognition v2, Latin model BUNDLED in the APK: works fully
  // offline, no Google Play services model download on first use.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
